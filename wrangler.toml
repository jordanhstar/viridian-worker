name = "viridian"
main = "worker.js"
compatibility_date = "2026-01-01"

# Durable Object binding — this is the piece the dashboard UI wasn't
# picking up. Declaring it here, directly, sidesteps that entirely.
[[durable_objects.bindings]]
name = "USER_TIMELINE"
class_name = "UserTimeline"

# Required the first time a new Durable Object class is introduced —
# tells Cloudflare "this class is brand new, provision storage for it."
[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserTimeline"]

# Your existing KV namespace and secret still need to be present in your
# Cloudflare account — wrangler will attach to them by ID below. Run
#   wrangler kv:namespace list
# to find the id for the namespace you already created for VIRIDIAN_KV,
# and paste it in below.
[[kv_namespaces]]
binding = "VIRIDIAN_KV"
id = "PASTE_YOUR_VIRIDIAN_KV_NAMESPACE_ID_HERE"

[[kv_namespaces]]
binding = "TOKENS"
id = "PASTE_YOUR_TOKENS_NAMESPACE_ID_HERE"
